name: Release and Sync

on:
  push:
    tags:
      - 'v*'
      - 'emotions-nlp-*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            datasets/emotions-nlp-v2/data/train.csv
            datasets/emotions-nlp-v2/data/test.csv
            datasets/emotions-nlp-v2/data/val.csv
            datasets/emotions-nlp-v2/metadata.json

  sync-huggingface:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "bot@kryonara.ai"
          git config --global user.name "Kryonara Bot"
          git remote add hf https://kryonara-bot:$HF_TOKEN@huggingface.co/datasets/kryonara-ai-lab/emotions-nlp-v2
          git push --force hf main
